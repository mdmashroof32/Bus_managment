# Render Infrastructure as Code (Blueprint) configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: delhi-bus-management
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
